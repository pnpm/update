name: Test

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ubuntu runners ship shellcheck; lint the real bash scripts (the action's
      # thin ${{ }} wiring steps aren't shell to check).
      - name: Shellcheck the scripts
        run: shellcheck scripts/*.sh
      # Run bats via npx rather than `npm install -g` (which needs root for the
      # global prefix on hosted runners); Node/npx are preinstalled.
      - name: Run unit and integration tests
        run: npx --yes bats test/
